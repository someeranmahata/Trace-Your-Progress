<!DOCTYPE html>
<html>

<head>
    <title>Advanced Task Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">


</head>

<body>

    <h2>Yearly Task Dashboard</h2>

    <div class="main-layout">

        <div class="profile-box">
            <h3>Profile</h3>

            <div style="text-align:center;">
                <div class="profile-avatar">
                    <img src="OIP.webp" alt="Profile">
                </div>
            </div>


            <div class="profile-info">
                <p><strong>Name:</strong> Someeran</p>
                <p><strong>Total Tasks:</strong> <span id="totalTasks">0</span></p>
                <p><strong>Completed:</strong> <span id="completedTasks">0</span></p>
                <p><strong>Completion %:</strong> <span id="completionPercent">0%</span></p>
            </div>
        </div>

        <div class="dashboard-content">

            <div style="text-align:center;">
                <button onclick="changeDate(-1)">◀</button>
                <input type="date" id="dateInput">
                <button onclick="changeDate(1)">▶</button>

                <input type="text" id="taskName" placeholder="Task name">
                <button onclick="addTask()">Add Task</button>
                <button onclick="copyYesterdayTasks()">Same as Yesterday</button>
                <button onclick="resetData()" class="reset-btn">Reset All Data</button>
            </div>

            <!-- TOP ROW -->
            <div class="top-section">

                <!-- GRAPHS WRAPPER -->
                <div class="graphs-wrapper">
                    <div class="chart-box">
                        <canvas id="barChart"></canvas>
                    </div>

                    <div class="chart-box">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>

                <!-- TASK LIST -->
                <div class="task-box">
                    <h4>Tasks (Selected Date)</h4>
                    <div id="taskList">Select a date to view tasks</div>
                </div>

            </div>

            <!-- MONTHS BELOW GRAPHS ONLY -->
            <div class="months-wrapper">
                <div class="months-container" id="allMonths"></div>
            </div>

        </div>

    </div>


</body>
<script src="script.js"></script>

</html>
